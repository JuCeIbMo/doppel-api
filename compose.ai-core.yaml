# ⚠️ ALIAS DE COMPATIBILIDAD — NO EDITAR AQUÍ.
# La fuente de verdad es compose.yaml. Este archivo existe solo porque Dokploy
# todavía apunta su "Compose Path" a ./compose.ai-core.yaml. Mantiene el deploy
# funcionando con la arquitectura nueva (doppel-api + LangGraph in-process + Postgres)
# sin tener que cambiar el campo en el panel.
# Si cambias el Compose Path a ./compose.yaml en Dokploy, borra este archivo.
# Cualquier cambio real va en compose.yaml y luego se copia aquí.
services:
  doppel-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doppel-api
    env_file:
      - .env
    environment:
      # El checkpointer oficial de LangGraph usa RedisJSON + RediSearch.
      REDIS_URL: redis://langgraph-redis:6379/0
      # Flag de "bot activado": cualquier valor no vacío activa el bot.
      AI_CORE_URL: enabled
    depends_on:
      langgraph-redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  langgraph-redis:
    image: redis:8.0
    container_name: langgraph-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - langgraph-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  langgraph-redis-data:
