services:
  doppel-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doppel-api
    env_file:
      - .env
    environment:
      # El checkpointer oficial de LangGraph usa RedisJSON + RediSearch.
      REDIS_URL: redis://langgraph-redis:6379/0
      # Flag de "bot activado": cualquier valor no vacío activa el bot.
      AI_CORE_URL: enabled
    depends_on:
      langgraph-redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  langgraph-redis:
    # Redis 8 bundles the RedisJSON and RediSearch modules required by
    # langgraph-checkpoint-redis.
    image: redis:8.0
    container_name: langgraph-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - langgraph-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  langgraph-redis-data:
